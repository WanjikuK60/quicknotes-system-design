<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple QuickNotes API client for creating, loading, and deleting notes."
    />
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <p class="eyebrow">A LITTLE SPACE FOR YOUR IDEAS</p>
        <h1>QuickNotes</h1>
        <p class="tagline">A note-taking client connected to a practice API.</p>
      </div>
    </header>

    <main>
      <section class="panel" aria-labelledby="add-heading">
        <div class="section-heading">
          <p class="section-index">01 / CAPTURE</p>
          <h2 id="add-heading">Add a note</h2>
        </div>
        <form id="note-form">
          <div class="form-field">
            <label for="title-input">Title</label>
            <input
              id="title-input"
              name="title"
              type="text"
              maxlength="100"
              required
              autocomplete="off"
            />
          </div>
          <div class="form-field">
            <label for="body-input">Body <span class="optional">(optional)</span></label>
            <textarea id="body-input" name="body" rows="4"></textarea>
          </div>
          <button id="submit-btn" type="submit">Create note</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="notes-heading">
        <div class="section-heading notes-heading">
          <div>
            <p class="section-index">02 / COLLECTION</p>
            <h2 id="notes-heading">Your notes</h2>
          </div>
          <button id="load-btn" type="button">Load notes</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <ul id="notes-list" aria-live="polite"></ul>
      </section>
    </main>

    <footer>
      <p>Practice client using JSONPlaceholder. Created notes are not persisted by that service.</p>
    </footer>
  </body>
</html>
